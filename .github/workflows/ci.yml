name: CI

on:
  push:
    branches:
      - gpt-5.5
  pull_request:
    branches:
      - gpt-5.5

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint && pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API e2e tests
        run: pnpm --filter @models-dev/api test:e2e

      - name: Build
        run: pnpm build

      - name: Docker build
        run: docker build -t models-dev-explorer:${{ github.sha }} .
