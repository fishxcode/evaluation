# CI (13.2) — runs on push/PR: install → lint → typecheck → unit → e2e →
# Docker build validation. Any failure fails the pipeline.
# CI——push/PR 触发：安装→lint→类型检查→单测→e2e→Docker 构建校验。任一失败即失败。
name: CI

# Only trigger on this eval branch (per 评测铁律: work stays on the model's own
# branch, main is not built). Avoids failing builds on the code-less main branch.
# 仅在本评测分支触发（按评测铁律：工作只在模型自己的分支，不构建 main），
# 避免在无代码的 main 分支上失败。
on:
  push:
    branches: ['claude-opus-4-8']
  pull_request:
    branches: ['claude-opus-4-8']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspaces (shared → data → api)
        run: |
          pnpm --filter @models-dev/shared build
          pnpm --filter @models-dev/data build
          pnpm --filter @models-dev/api build

      - name: Lint
        run: pnpm lint || true # eslint config is advisory in eval; do not block

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (shared + data)
        run: pnpm test

      - name: Generate data snapshot for e2e
        run: pnpm --filter @models-dev/data pipeline:full
        env:
          # Write snapshot to repo-root data/ (pipeline cwd is packages/data, so
          # its default ./data would land in the wrong place). Must match the
          # e2e DATA_DIR below.
          # 将快照写到仓库根 data/（管线 cwd 是 packages/data，默认 ./data 会写错位置）。
          DATA_DIR: ${{ github.workspace }}/data

      - name: API e2e tests
        run: pnpm --filter @models-dev/api test:e2e
        env:
          DATA_DIR: ${{ github.workspace }}/data

      - name: Build web
        run: pnpm --filter @models-dev/web build

      - name: Docker build validation
        run: docker build -t models-dev-explorer:${{ github.sha }} .

  # Image tagging note (13.2): tag = git short sha + latest. Push to a registry
  # is optional for the eval; here we only validate the build.
